<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinyal KOL dan smart money</title>
<style>
:root{--bg:#edf0f3;--panel:#fff;--ink:#15212c;--muted:#5e6b78;--line:#d3d9df;--vs:#065a49;--st:#0b7a63;--md:#b26b00;--wk:#7a8794;--warn:#b3382f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 48px}
h1{font:700 28px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
#status{margin:0 0 16px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
#chains{display:flex;flex-wrap:wrap;gap:6px}
#chains button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
#chains button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{background:var(--panel);border:1px solid var(--line);border-left-width:6px;border-radius:6px;padding:14px 16px;margin-bottom:10px}
.row.very_strong{border-left-color:var(--vs);border-left-width:10px}
.row.strong{border-left-color:var(--st)}
.row.medium{border-left-color:var(--md)}
.row.weak{border-left-color:var(--wk)}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.sym{font:700 22px/1.2 Georgia,"Times New Roman",serif;margin:0}
.chain,.tag{font-size:13px;color:var(--muted)}
.tag{font-weight:600}
.very_strong .tag{color:var(--vs)}.strong .tag{color:var(--st)}.medium .tag{color:var(--md)}
.stats{display:flex;flex-wrap:wrap;gap:6px 24px;margin:8px 0 0}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:16px}
.buyers,.warn{margin:8px 0 0;font-size:14px}
.warn{color:var(--warn);font-weight:600}
.row a{font-size:14px;color:var(--ink)}
.empty,footer{color:var(--muted)}
footer{margin-top:24px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Sinyal KOL dan smart money</h1>
  <p id="status">Memuat data…</p>
  <div class="bar">
    <div id="chains" role="group" aria-label="Pilih chain"></div>
    <label><input type="checkbox" id="notify"> Beri notifikasi untuk sinyal kuat</label>
  </div>
  <main id="list" aria-live="polite"></main>
  <footer>Data dari GMGN, diperbarui sekitar tiap 5 menit. Pembelian KOL dan smart money hanyalah informasi, bukan saran finansial.</footer>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const LABEL = { very_strong: 'Sangat kuat', strong: 'Kuat', medium: 'Sedang', weak: 'Lemah' };
  const state = { data: null, chain: 'all' };
  const seen = new Set();
  let firstLoad = true;

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const ago = ts => {
    const m = Math.max(0, Math.round((Date.now() / 1000 - ts) / 60));
    return m < 1 ? 'baru saja' : m < 60 ? m + ' menit lalu' : Math.round(m / 60) + ' jam lalu';
  };
  const usd = n => '$' + (n >= 1000 ? (n / 1000).toFixed(1) + 'K' : Math.round(n));
  const stat = (label, value) => {
    const d = el('div', 'stat');
    d.append(el('span', '', label), el('b', '', value));
    return d;
  };

  function renderChains() {
    const box = $('chains');
    box.replaceChildren();
    for (const c of ['all', ...Object.keys(state.data.chains)]) {
      const b = el('button', '', c === 'all' ? 'Semua' : c);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(state.chain === c));
      b.onclick = () => { state.chain = c; renderChains(); renderList(); };
      box.append(b);
    }
  }

  function renderStatus() {
    const d = state.data;
    const bad = Object.entries(d.chains).filter(([, s]) => s.errors.length);
    let t = 'Diperbarui ' + ago(d.updatedAt) + '. Menampilkan pembelian ' + d.windowMin + ' menit terakhir.';
    if (bad.length) t += ' Data tidak lengkap untuk: ' + bad.map(([c]) => c).join(', ') + '.';
    $('status').textContent = t;
  }

  function renderList() {
    const d = state.data;
    const list = $('list');
    list.replaceChildren();
    const items = d.signals.filter(s => state.chain === 'all' || s.chain === state.chain);
    if (!items.length) {
      list.append(el('p', 'empty', 'Belum ada pembelian KOL atau smart money di chain ini dalam ' + d.windowMin + ' menit terakhir.'));
      return;
    }
    for (const s of items) {
      const row = el('article', 'row ' + s.strength);
      const head = el('div', 'head');
      head.append(el('h2', 'sym', s.symbol), el('span', 'chain', s.chain), el('span', 'tag', LABEL[s.strength]));
      const stats = el('div', 'stats');
      stats.append(
        stat('Smart money membeli', String(s.smart)),
        stat('KOL membeli', String(s.kol)),
        stat('Total pembelian', usd(s.usd)),
        stat('Pembelian terakhir', ago(s.last))
      );
      row.append(head, stats);
      if (s.smartSells) row.append(el('p', 'warn', s.smartSells + ' smart money menjual token ini. Pertimbangkan sebagai sinyal keluar.'));
      if (s.kol && !s.smart) row.append(el('p', 'warn', 'Hanya KOL yang membeli, belum ada smart money.'));
      row.append(el('p', 'buyers', 'Pembeli terbesar: ' + s.buyers.map(b => b.label + ' (' + (b.tag === 'kol' ? 'KOL' : 'smart money') + ', ' + usd(b.usd) + ')').join(', ')));
      if (/^[a-z]+$/.test(s.chain) && /^[A-Za-z0-9]+$/.test(s.address)) {
        const a = el('a', '', 'Buka di GMGN');
        a.href = 'https://gmgn.ai/' + s.chain + '/token/' + s.address;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        const p = el('p', 'buyers');
        p.append(a);
        row.append(p);
      }
      list.append(row);
    }
  }

  function notifyNew() {
    for (const s of state.data.signals) {
      const k = s.chain + ':' + s.address + ':' + s.strength;
      if (seen.has(k)) continue;
      seen.add(k);
      if (!firstLoad && $('notify').checked && (s.strength === 'strong' || s.strength === 'very_strong')
          && 'Notification' in window && Notification.permission === 'granted') {
        new Notification('Sinyal ' + LABEL[s.strength].toLowerCase() + ': ' + s.symbol,
          { body: s.smart + ' smart money dan ' + s.kol + ' KOL membeli di ' + s.chain });
      }
    }
    firstLoad = false;
  }

  async function load() {
    try {
      const r = await fetch('data/signals.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      state.data = await r.json();
      renderStatus(); renderChains(); renderList(); notifyNew();
    } catch (e) {
      $('status').textContent = 'Data belum bisa dimuat. Pastikan workflow GitHub Actions sudah berjalan sekali. (' + e.message + ')';
    }
  }

  $('notify').addEventListener('change', async e => {
    if (!e.target.checked) return;
    if (!('Notification' in window)) { e.target.checked = false; $('status').textContent = 'Browser ini tidak mendukung notifikasi.'; return; }
    const p = await Notification.requestPermission();
    if (p !== 'granted') { e.target.checked = false; $('status').textContent = 'Izin notifikasi ditolak. Aktifkan lewat pengaturan situs di browser.'; }
  });

  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
