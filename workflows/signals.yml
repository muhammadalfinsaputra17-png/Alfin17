name: Update GMGN signals

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install GMGN CLI
        run: npm install -g gmgn-cli
      - name: Configure API key
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        run: |
          mkdir -p ~/.config/gmgn
          printf 'GMGN_API_KEY=%s\n' "$GMGN_API_KEY" > ~/.config/gmgn/.env
          chmod 600 ~/.config/gmgn/.env
      - name: Fetch KOL and smart money trades
        env:
          CHAINS: sol,robinhood,hyperevm
          WINDOW_MIN: '60'
        run: node scripts/fetch.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
